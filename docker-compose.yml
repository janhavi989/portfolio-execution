services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: kalpi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: kalpi_secret
      POSTGRES_DB: portfolio_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d portfolio_engine"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ─── Backend (FastAPI) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kalpi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://kalpi:kalpi_secret@postgres:5432/portfolio_engine
      SECRET_KEY: super-secret-jwt-key-change-in-production
      PAPER_TRADING: "false"
      WEBHOOK_URL: http://localhost:8000/api/v1/notifications/webhook-receiver
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (React + Vite / Nginx) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kalpi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kalpi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:


